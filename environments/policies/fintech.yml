name: fintech
version: 1
description: Demonstration policy pack for a payments business with strict change control. Not any organisation's real policy.
journeys:
  payments: {match: ["/payments", "/refunds", "/pay"], availability: 0.9995, latency_p95_ms: 250, min_requests: 20}
actions:
  auto_rollback: {allow_kinds: [], require_last_good: true}
  approve_patch: {authorised_approvers: [akash, aryan, syna], require_confirming_test: true}
  scale: {require_capacity_evidence: true, automatic: false}
data_handling:
  redact: [card_numbers, access_tokens, emails, user_ids]
  llm_may_see: [source_code]

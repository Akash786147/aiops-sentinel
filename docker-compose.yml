services:
  sentinel:
    build: .
    ports: ["8000:8000"]
    environment:
      OLLAMA_BASE_URL: http://100.105.206.57:11434
      OLLAMA_MODEL: qwen2.5-coder:7b
      VICTIM_URL: http://victim:8001
      CODE_ROOT: /workspace
      RETRIEVAL_SERVICE_URL: http://retrieval-service:8010
      LLM_SERVICE_URL: http://llm-service:8011
      MONITOR_SERVICE_URL: http://monitor-service:8012
    depends_on: [victim, retrieval-service, llm-service, monitor-service]

  victim:
    build: .
    command: uvicorn app.victim:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]

  retrieval-service:
    build: .
    command: uvicorn microservices.retrieval_api:app --host 0.0.0.0 --port 8010
    environment:
      CODE_ROOT: /workspace
    ports: ["8010:8010"]

  llm-service:
    build: .
    command: uvicorn microservices.llm_api:app --host 0.0.0.0 --port 8011
    environment:
      OLLAMA_BASE_URL: http://100.105.206.57:11434
      OLLAMA_MODEL: qwen2.5-coder:7b
    ports: ["8011:8011"]

  monitor-service:
    build: .
    command: uvicorn microservices.monitor_api:app --host 0.0.0.0 --port 8012
    environment:
      VICTIM_URL: http://victim:8001
    depends_on: [victim]
    ports: ["8012:8012"]

  ollama:
    image: ollama/ollama:latest
    profiles: [local-ollama]
    ports: ["11434:11434"]
    volumes: [ollama-data:/root/.ollama]

  # Optional rubric evidence: Sourcegraph OSS indexes this repository. Start with:
  # docker compose --profile sourcegraph up -d sourcegraph
  sourcegraph:
    image: sourcegraph/server:5.9.8
    profiles: [sourcegraph]
    ports: ["7080:7080"]
    volumes: [sourcegraph-data:/var/opt/sourcegraph]

volumes:
  ollama-data:
  sourcegraph-data:

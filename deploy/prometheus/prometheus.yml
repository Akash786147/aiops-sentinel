global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - path_prefix: /alertmanager
      static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: sentinel
    static_configs:
      - targets: ["sentinel:8000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]

  # Every container Sentinel runs carries sentinel.monitor=true plus the port and path of its metrics.
  - job_name: services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["sentinel.monitor=true"]
    relabel_configs:
      - source_labels: [__meta_docker_network_name]
        regex: sentinel
        action: keep
      - source_labels: [__meta_docker_container_label_sentinel_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_sentinel_metrics_port]
        regex: (.+);(.+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_docker_container_label_sentinel_metrics_path]
        regex: (.+)
        target_label: __metrics_path__

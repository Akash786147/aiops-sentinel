server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Logs of every container on the sentinel network: monitored services and the platform itself.
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_label_sentinel_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: component
    pipeline_stages:
      - docker: {}
      - match:
          selector: '{service=~".+"}'
          stages:
            - json:
                expressions:
                  exception: exception
            - labels:
                exception:
